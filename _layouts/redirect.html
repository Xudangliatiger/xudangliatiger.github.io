<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ page.title }}</title>
  <link rel="canonical" href="{{ site.url }}{{ page.redirect_to }}">
  <meta http-equiv="refresh" content="0; url={{ page.redirect_to | prepend: site.baseurl }}">
  <meta name="robots" content="noindex">
</head>
<body>
  <a href="{{ page.redirect_to | prepend: site.baseurl }}">{{ page.title }}</a>
</body>
</html>
