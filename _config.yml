# Build settings
# from 2016, 'pygments' is unsupported on GitHub Pages. Use 'rouge' for highlighting instead.
highlighter: rouge
permalink: pretty
exclude:
  - less
  - node_modules
  - Gruntfile.js
  - package.json
  - README.md
  - README.zh.md
  - test.py
  - test_private_huatuo_v3.csv
  - test_private_huatuo_v3_revised.csv
  - test_private_huatuo_v3_revised_plus_baseline.csv
  - test_private_v1_40000.csv
  - test_public_huatuo_v3.csv
  - test_public_huatuo_v3_revised.csv
  - test_public_huatuo_v3_revised_plus_baseline.csv
  - test_public_v1_40000.csv
anchorjs: true                          # if you want to customize anchor. check out line:181 of `post.html`

# Research publishing system
# Each document in `_research_projects` becomes a polished public project page.
# The matching Lab Log lives under `research/<project-id>/lab/` and reuses the
# same project metadata and shared components.
collections:
  research_projects:
    output: true
    permalink: /research/:name/
  research_projects_en:
    output: true
    permalink: /en/research/:name/
  research_notes_en:
    output: true
    permalink: /en/research/notes/:name/
  research_experiments:
    output: true
    permalink: /research/experiments/:name/
  research_experiments_en:
    output: true
    permalink: /en/research/experiments/:name/
  research_blog_en:
    output: true
    permalink: /en/blog/notes/:name/



# Markdown settings
# replace redcarpet to kramdown,
# although redcarpet can auto highlight code, the lack of header-id make the catalog impossible, so I switch to kramdown
# document: http://jekyllrb.com/docs/configuration/#kramdown
markdown: kramdown
kramdown:
  input: GFM                            # use Github Flavored Markdown !important



